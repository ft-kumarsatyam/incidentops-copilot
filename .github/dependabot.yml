version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups:
      web-dev-tooling:
        patterns: ["vite*", "vitest*", "@vitejs/*", "typescript", "@testing-library/*", "jsdom"]
