name: Badges

# Keeps assets/badges/*.json (the README's numeric badges) equal to what the evals and the test
# collection report. On pull requests it only checks, so a change that moves a number cannot merge
# with a stale badge. On main it regenerates and commits the files if they changed.
on:
  push:
    branches: [main]
    paths-ignore: ["assets/badges/**"]
  pull_request:

permissions:
  contents: read

jobs:
  badges:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit refreshed badge files to main
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: |
          uv venv
          uv pip install -e ".[dev]"
      - name: Run the reports the badges are read from
        run: |
          .venv/bin/python -m evals.run_evals --provider rules
          .venv/bin/python -m evals.guardrail_eval
          .venv/bin/python -m evals.run_retrieval_evals --modes fts,rewrite
      - name: Check (pull requests)
        if: github.event_name == 'pull_request'
        run: .venv/bin/python scripts/update_badges.py --check
      - name: Refresh and commit (main)
        if: github.event_name == 'push'
        run: |
          .venv/bin/python scripts/update_badges.py
          if git diff --quiet -- assets/badges; then
            echo "badges already current"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/badges
            git commit -m "chore: refresh README badges [skip ci]"
            git push
          fi
