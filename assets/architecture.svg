<svg xmlns="http://www.w3.org/2000/svg" width="900" height="570" viewBox="0 0 900 570" role="img" aria-label="IncidentOps Copilot system architecture">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b6b69"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#17201f}
      .t{font-size:15px;font-weight:700}.s{font-size:12px;fill:#4a5856}.h{font-size:13px;font-weight:700;fill:#0f6b63;letter-spacing:1px}
      .box{fill:#fff;stroke:#c9d2cf;stroke-width:1.2}.line{stroke:#5b6b69;stroke-width:1.6;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="900" height="570" rx="18" fill="#f6f4ef" stroke="#e1ddd2"/>
  <text x="30" y="34" class="h">INCIDENTOPS COPILOT · SYSTEM ARCHITECTURE</text>

  <!-- inputs -->
  <rect x="30" y="52" width="250" height="52" rx="10" class="box"/><text x="46" y="75" class="t">Slack report</text><text x="46" y="93" class="s">via n8n intake webhook</text>
  <rect x="325" y="52" width="250" height="52" rx="10" class="box"/><text x="341" y="75" class="t">Web UI</text><text x="341" y="93" class="s">React · live queue · approval page</text>
  <rect x="620" y="52" width="250" height="52" rx="10" class="box"/><text x="636" y="75" class="t">CLI and API clients</text><text x="636" y="93" class="s">incidentops incident · digest</text>
  <path d="M155 104 V132" class="line"/><path d="M450 104 V132" class="line"/><path d="M745 104 V132" class="line"/>

  <!-- api -->
  <rect x="30" y="134" width="840" height="52" rx="10" fill="#e6f1ef" stroke="#9cc5bf"/>
  <text x="46" y="157" class="t">FastAPI service</text>
  <text x="46" y="175" class="s">fail-closed API key · HMAC check on inbound reports · rate limit (memory or Redis) · request and run IDs · SSE live events</text>
  <path d="M450 186 V212" class="line"/>

  <!-- langgraph -->
  <rect x="30" y="214" width="840" height="190" rx="12" fill="#fff" stroke="#9cc5bf" stroke-dasharray="6 4"/>
  <text x="46" y="236" class="h">LANGGRAPH WORKFLOW · DURABLE CHECKPOINTS</text>
  <g>
    <rect x="46" y="250" width="132" height="40" rx="8" class="box"/><text x="112" y="275" text-anchor="middle" class="t">intake</text>
    <rect x="212" y="250" width="132" height="40" rx="8" class="box"/><text x="278" y="275" text-anchor="middle" class="t">research</text>
    <rect x="378" y="250" width="132" height="40" rx="8" class="box"/><text x="444" y="275" text-anchor="middle" class="t">assess</text>
    <rect x="544" y="250" width="132" height="40" rx="8" class="box"/><text x="610" y="275" text-anchor="middle" class="t">critic</text>
    <rect x="710" y="250" width="144" height="40" rx="8" class="box"/><text x="782" y="275" text-anchor="middle" class="t">finalize</text>
    <path d="M178 270 H210" class="line"/><path d="M344 270 H376" class="line"/><path d="M510 270 H542" class="line"/><path d="M676 270 H708" class="line"/>
    <path d="M610 250 V240 H278 V248" class="line" stroke-dasharray="4 3"/>
    <text x="854" y="236" text-anchor="end" class="s">critic loop: more evidence, bounded</text>
  </g>
  <rect x="46" y="312" width="296" height="76" rx="10" fill="#f3f7f6" stroke="#c9d2cf"/>
  <text x="60" y="334" class="t">Research tools</text>
  <text x="60" y="353" class="s">ToolBroker: monitoring, GitHub, runbook RAG</text>
  <text x="60" y="370" class="s">(FTS5 + query rewrite, optional hybrid)</text>
  <text x="60" y="383" class="s">MCP read-only hook, opt-in</text>
  <rect x="362" y="312" width="296" height="76" rx="10" fill="#f3f7f6" stroke="#c9d2cf"/>
  <text x="376" y="334" class="t">Assess and critique</text>
  <text x="376" y="353" class="s">Claude with structured output, or the offline</text>
  <text x="376" y="370" class="s">rules engine. AI_TOPOLOGY: monolithic, or</text>
  <text x="376" y="383" class="s">specialists (RoleGraph, parallel roles)</text>
  <rect x="678" y="312" width="176" height="76" rx="10" fill="#fff4e0" stroke="#e5c27a"/>
  <text x="692" y="334" class="t">Guardrails in code</text>
  <text x="692" y="353" class="s">fenced and redacted input</text>
  <text x="692" y="370" class="s">closed action list, evidence</text>
  <text x="692" y="383" class="s">required, confidence ceiling</text>
  <path d="M278 290 V310" class="line"/><path d="M444 290 V310" class="line"/><path d="M782 290 V310" class="line"/>
  <path d="M180 404 V430" class="line"/>

  <!-- approval and dispatch -->
  <rect x="30" y="432" width="300" height="62" rx="12" fill="#fff4e0" stroke="#d9a441" stroke-width="2"/>
  <text x="46" y="458" class="t">A person decides</text>
  <text x="46" y="477" class="s">interrupt() · tick actions · confirm</text>
  <rect x="380" y="432" width="230" height="62" rx="12" class="box"/>
  <text x="396" y="458" class="t">Dispatch, approved only</text>
  <text x="396" y="477" class="s">signed webhook · retries · idempotent</text>
  <rect x="660" y="432" width="210" height="62" rx="12" class="box"/>
  <text x="676" y="458" class="t">n8n or Zapier</text>
  <text x="676" y="477" class="s">GitHub issue · Slack · email</text>
  <path d="M330 463 H378" class="line"/><path d="M610 463 H658" class="line"/>

  <!-- persistence -->
  <rect x="30" y="512" width="840" height="40" rx="10" fill="#e6f1ef" stroke="#9cc5bf"/>
  <text x="46" y="537" class="s"><tspan class="t" style="font-size:13px">Persistence</tspan>   SQLite or Postgres: checkpoints, incident index, append-only audit log   ·   Redis (optional): shared events and rate limits</text>
</svg>
