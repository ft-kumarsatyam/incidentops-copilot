# Postgres and Redis for `make loadtest` (scripts/loadtest.py). Separate project name and ports, and
# Postgres keeps its default durability settings (unlike compose.test.yaml), so write latency is
# realistic. `loadtest.py matrix` starts and removes these itself.
name: incidentops-loadtest

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_PASSWORD: loadtest
    ports:
      - "127.0.0.1:55434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:56380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
