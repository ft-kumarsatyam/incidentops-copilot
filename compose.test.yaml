# Throwaway Postgres and Redis for the test suite. `make test`, `make cov` and `make check`
# start these automatically; `make test-services-down` stops and wipes them.
# Bound to localhost on unusual ports so they never collide with a real database or Redis.
name: incidentops-test

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: test
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off"]
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
