groups:
  - name: incidentops
    rules:
      - alert: IncidentOpsDown
        expr: up{job="incidentops"} == 0
        for: 2m
        labels: {severity: page}
        annotations:
          summary: An IncidentOps API replica is not being scraped.
      - alert: IncidentOpsServerErrors
        expr: |
          sum(rate(incidentops_http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(incidentops_http_requests_total[5m])), 1e-9) > 0.05
        for: 5m
        labels: {severity: page}
        annotations:
          summary: More than 5% of API responses are 5xx.
      - alert: IncidentOpsDispatchFailing
        expr: increase(incidentops_dispatch_total{result="failed"}[15m]) > 0
        labels: {severity: ticket}
        annotations:
          summary: Approved actions failed to reach n8n or Zapier. Use Retry on the incident page.
      - alert: IncidentOpsSlowRequests
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(incidentops_http_request_duration_seconds_bucket[5m]))) > 2
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: p95 API latency has been above 2 seconds for 10 minutes.
