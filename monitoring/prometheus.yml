# Scrapes every API replica. With the compose profile this is the single `api` service; for
# several replicas, point `dns_sd_configs` (or your service discovery) at all of them.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: incidentops
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /tmp/metrics_token # written from $METRICS_TOKEN at container start
    static_configs:
      - targets: ["api:8000"]
