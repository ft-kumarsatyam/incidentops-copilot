[project]
name = "incidentops-copilot"
version = "0.2.0"
description = "Human-approved AI incident triage: Claude proposes, a person approves, n8n executes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kumar Satyam" }]
keywords = ["langgraph", "incident-management", "n8n", "human-in-the-loop"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

dependencies = [
  "fastapi>=0.115",
  "langgraph>=1.0",
  "langgraph-checkpoint-sqlite>=2.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "httpx>=0.27.0",
  "structlog>=24.1",
  "tenacity>=9.0",
  "uvicorn>=0.34",
]

[project.urls]
Homepage = "https://github.com/ft-kumarsatyam/incidentops-copilot"
Documentation = "https://github.com/ft-kumarsatyam/incidentops-copilot/tree/main/docs"
Changelog = "https://github.com/ft-kumarsatyam/incidentops-copilot/blob/main/CHANGELOG.md"
Issues = "https://github.com/ft-kumarsatyam/incidentops-copilot/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "anthropic>=0.40",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.7",
]
llm = ["anthropic>=0.40"]
mcp = ["mcp>=1.0"]
otel = [
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp-proto-http>=1.25",
]
rag = [
  "fastembed>=0.4",
]

[project.scripts]
incidentops = "incidentops.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/incidentops"]
artifacts = ["src/incidentops/static"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["incidentops"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/incidentops"]

[[tool.mypy.overrides]]
module = ["tenacity.*", "langgraph.checkpoint.sqlite.*", "opentelemetry.*"]
ignore_missing_imports = true