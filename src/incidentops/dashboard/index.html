<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="IncidentOps incident command dashboard">
  <title>IncidentOps Response Board</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <header class="masthead">
    <a class="brand" href="/" aria-label="IncidentOps home">
      <span class="brand-mark" aria-hidden="true">IO</span>
      <span><b>IncidentOps</b><small>Response board</small></span>
    </a>
    <div class="system-state">
      <span class="beacon" aria-hidden="true"></span>
      <span><b>Control plane</b><small id="sync-label">Connecting</small></span>
    </div>
    <label class="key-field">
      <span>API key</span>
      <input id="api-key" type="password" autocomplete="off" placeholder="Only if configured">
    </label>
  </header>

  <main class="board">
    <aside class="queue" aria-label="Incident queue">
      <div class="queue-head">
        <div>
          <p class="eyebrow">Live queue</p>
          <h1>Response<br>board</h1>
        </div>
        <output id="incident-count" class="count">0</output>
      </div>
      <div class="filters" role="group" aria-label="Filter incidents">
        <button class="filter active" data-filter="open">Open</button>
        <button class="filter" data-filter="all">All</button>
        <button class="filter" data-filter="needs_human">Needs human</button>
      </div>
      <div id="incident-list" class="incident-list" aria-live="polite"></div>
    </aside>

    <section id="detail" class="detail" aria-live="polite">
      <div class="empty-state">
        <span class="empty-glyph" aria-hidden="true">↳</span>
        <p class="eyebrow">No incident selected</p>
        <h2>Choose a run from the response queue.</h2>
        <p>Evidence, runbook guidance, decisions, and the complete response log appear here.</p>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/assets/app.js" defer></script>
</body>
</html>
